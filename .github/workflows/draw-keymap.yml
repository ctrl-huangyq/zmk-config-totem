name: Draw keymap

on:
  workflow_dispatch:

  push:
    paths:
      - "config/totem.keymap"
      - "config/info.json"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"

jobs:
  draw:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install keymap-drawer
        run: pipx install keymap-drawer

      - name: Parse keymap
        run: |
          mkdir -p keymap-drawer

          keymap -c keymap_drawer.config.yaml parse \
            -z config/totem.keymap \
            --layer-names Base Direct Nav Num Sym Mouse Adjust \
            -o keymap-drawer/totem.yaml

      - name: Draw two-column keymap
        run: |
          keymap -c keymap_drawer.config.yaml draw \
            keymap-drawer/totem.yaml \
            -j config/info.json \
            -l LAYOUT \
            -o keymap-drawer/totem.svg

      - name: Draw one-column keymap
        run: |
          cat > /tmp/keymap-1col.yaml <<'EOF'
          draw_config:
            n_columns: 1
          EOF

          keymap -c keymap_drawer.config.yaml draw \
            keymap-drawer/totem.yaml \
            /tmp/keymap-1col.yaml \
            -j config/info.json \
            -l LAYOUT \
            -o keymap-drawer/totem-1col.svg

      - name: Commit updated diagrams
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: "keymap-drawer/*.svg keymap-drawer/*.yaml"
          commit_message: "docs: update keymap diagrams"
