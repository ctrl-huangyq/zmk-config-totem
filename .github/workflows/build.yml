name: Build ZMK firmware

on:
  push:
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "LICENSE"
      - "keymap-drawer/**"
      - "keymap_drawer.config.yaml"
      - "config/info.json"
      - ".github/workflows/draw-keymap.yml"

  pull_request:
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "LICENSE"
      - "keymap-drawer/**"
      - "keymap_drawer.config.yaml"
      - "config/info.json"
      - ".github/workflows/draw-keymap.yml"

  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
