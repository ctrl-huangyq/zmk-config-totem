parse_config:
  sticky_label: "★"
  toggle_label: "toggle"

  # Transparent positions stay visible.
  trans_legend:
    t: "▽"
    type: "trans"

  raw_binding_map:
    # Home-row mods
    "&hml LGUI S":
      t: "S"
      h: "GUI"
      type: "mod"
    "&hml LALT D":
      t: "D"
      h: "Alt"
      type: "mod"
    "&hml LCTRL F":
      t: "F"
      h: "Ctrl"
      type: "mod"

    "&hmr LCTRL J":
      t: "J"
      h: "Ctrl"
      type: "mod"
    "&hmr LALT K":
      t: "K"
      h: "Alt"
      type: "mod"
    "&hmr LGUI L":
      t: "L"
      h: "GUI"
      type: "mod"

    # Smart sticky mods
    "&smod LSHIFT LSHIFT":
      t: "Shift★"
      h: "Shift"
      type: "mod"
    "&smod LGUI LGUI":
      t: "GUI★"
      h: "GUI"
      type: "mod"
    "&smod LALT LALT":
      t: "Alt★"
      h: "Alt"
      type: "mod"
    "&smod LCTRL LCTRL":
      t: "Ctrl★"
      h: "Ctrl"
      type: "mod"

    # Wireless / output
    "&out OUT_TOG":
      t: "USB/BLE"
      type: "system"

    "&bt BT_CLR":
      t: "BT Clear"
      type: "system"

    "&bt BT_NXT":
      t: "BT Next"
      type: "system"

    # Firmware / reset
    "&bootloader":
      t: "Boot"
      type: "system"

    "&sys_reset":
      t: "Reset"
      type: "system"

    "&key_repeat": "Repeat"
    "&caps_word": "Caps Word"

    # Scroll
    "&msc SCRL_LEFT": "Scr←"
    "&msc SCRL_DOWN": "Scr↓"
    "&msc SCRL_UP": "Scr↑"
    "&msc SCRL_RIGHT": "Scr→"

    # Pointer movement
    "&mmv MOVE_LEFT": "Mouse←"
    "&mmv MOVE_DOWN": "Mouse↓"
    "&mmv MOVE_UP": "Mouse↑"
    "&mmv MOVE_RIGHT": "Mouse→"

    # Slow pointer movement
    "&mmv MOVE_X(-150)": "Slow←"
    "&mmv MOVE_Y(150)": "Slow↓"
    "&mmv MOVE_Y(-150)": "Slow↑"
    "&mmv MOVE_X(150)": "Slow→"

    # Mouse buttons
    "&mkp LCLK": "L Click"
    "&mkp RCLK": "R Click"
    "&mkp MCLK": "M Click"

  modifier_fn_map:
    left_ctrl: "Ctrl"
    right_ctrl: "Ctrl"
    left_shift: "Shift"
    right_shift: "Shift"
    left_alt: "Alt"
    right_alt: "Alt"
    left_gui: "GUI"
    right_gui: "GUI"
    keycode_combiner: "{mods}+{key}"
    mod_combiner: "{mod_1}+{mod_2}"

  # Make symbol layers render as actual symbols instead of names.
  zmk_keycode_map:
    BSPC: "Bksp"
    DEL: "Del"
    INS: "Ins"

    PG_DN: "PgDn"
    PG_UP: "PgUp"

    PSCRN: "PrintScr"

    C_BRI_DN: "Bri-"
    C_BRI_UP: "Bri+"

    C_VOL_DN: "Vol-"
    C_VOL_UP: "Vol+"
    C_MUTE: "Mute"

    C_PREV: "Prev"
    C_PP: "Play/Pause"
    C_NEXT: "Next"

    # Symbols
    CARET: "^"
    LT: "<"
    GT: ">"
    HASH: "#"
    DOLLAR: "$"

    EXCL: "!"
    AMPERSAND: "&"
    ASTERISK: "*"
    DQT: "\""
    SQT: "'"

    LBRC: "{"
    RBRC: "}"
    LPAR: "("
    RPAR: ")"
    EQUAL: "="

    BACKSLASH: "\\"
    TILDE: "~"
    LBKT: "["
    RBKT: "]"
    PERCENT: "%"
    GRAVE: "`"

    PIPE: "|"
    PLUS: "+"
    MINUS: "-"
    UNDER: "_"
    AT: "@"

  zmk_combos:
    combo_escape:
      align: top
      offset: 0.5

    combo_caps_word:
      align: bottom
      offset: 0.5

draw_config:
  dark_mode: false
  n_columns: 2

  # Key geometry
  key_h: 54
  key_rx: 8
  key_ry: 8

  combo_w: 25
  combo_h: 22

  inner_pad_w: 3
  inner_pad_h: 3

  outer_pad_w: 28
  outer_pad_h: 46

  # Typography
  line_spacing: 1.15
  shrink_wide_legends: 8
  append_colon_to_layer_header: false

  footer_text: "TOTEM 38 · ★ sticky tap · lower legend = hold · ▽ = transparent · transparent thumbs inherit Base"

  svg_extra_style: |
    svg.keymap {
      font-family:
        Inter,
        "Noto Sans",
        "Segoe UI",
        system-ui,
        sans-serif;

      font-size: 13px;
      font-weight: 500;

      --km-text: #202228;
      --km-muted: #767c86;

      --km-key: #f7f8fa;
      --km-key-border: #d8dbe1;

      --km-mod: #eef2f8;
      --km-system: #faf1ed;

      --km-held: #e7edf8;
      --km-combo: #e8eef8;

      --km-accent: #556b92;

      fill: var(--km-text);
    }

    rect.key {
      fill: var(--km-key);
    }

    rect.key,
    rect.combo {
      stroke: var(--km-key-border);
      stroke-width: 1;
    }

    rect.key.mod {
      fill: var(--km-mod);
    }

    rect.key.system {
      fill: var(--km-system);
    }

    rect.held,
    rect.combo.held {
      fill: var(--km-held);
      stroke: var(--km-accent);
      stroke-width: 1.2;
    }

    rect.combo,
    rect.combo-separate {
      fill: var(--km-combo);
      stroke: var(--km-accent);
    }

    path.combo {
      stroke: var(--km-accent);
      stroke-width: 1;
      opacity: 0.65;
      fill: none;
    }

    text.label {
      font-family:
        Inter,
        "Noto Sans",
        "Segoe UI",
        system-ui,
        sans-serif;

      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.03em;

      fill: var(--km-text);

      stroke: none;
      paint-order: normal;
    }

    text.tap {
      font-weight: 650;
    }

    text.hold,
    text.shifted,
    text.left,
    text.right,
    text.tl,
    text.tr,
    text.bl,
    text.br {
      fill: var(--km-muted);
      font-size: 10px;
      font-weight: 500;
    }

    text.layer-activator {
      fill: var(--km-accent);
      font-weight: 700;
      text-decoration: none;
    }

    text.trans {
      fill: var(--km-muted);
      opacity: 0.55;
      font-size: 11px;
      font-weight: 650;
    }

    text.footer {
      fill: var(--km-muted);
      font-size: 10px;
      font-weight: 400;

      stroke: none;
      paint-order: normal;
    }

    @media (prefers-color-scheme: dark) {
      svg.keymap {
        --km-text: #e8eaf0;
        --km-muted: #979da8;

        --km-key: #262a31;
        --km-key-border: #3d434d;

        --km-mod: #303641;
        --km-system: #3a302e;

        --km-held: #303a4b;
        --km-combo: #303a4b;

        --km-accent: #9bafd4;

        fill: var(--km-text);
      }
    }
